[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specdec"
version = "0.1.0"
description = "Speculative decoding pipeline: small draft model plus large target, with per-request acceptance-rate tracking and measured speedup"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]
plots = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/specdec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
